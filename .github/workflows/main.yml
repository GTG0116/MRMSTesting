name: Update Weather Data

on:
  workflow_dispatch:      # Allows manual/external triggers
  repository_dispatch:    # Allows API triggers
    types: [update_radar]
  schedule:
    - cron: '*/15 * * * *' # Keep this as a backup

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python Dependencies
        run: |
          pip install numpy xarray cfgrib matplotlib requests beautifulsoup4 pillow scipy

      - name: Rotate Frames
        run: |
          mkdir -p public/data
          cd public/data

          # The processing script always writes the new frame as index 0, so
          # every frame already on disk is shifted up one index before it runs.
          # Frame 14 is the oldest kept frame (NUM_FRAMES=15); whatever was
          # there is overwritten by frame 13 and drops off the end.
          #
          # The frames are GeoJSON — the products are published as vector
          # contour bands, not rasters — plus a metadata JSON and, for the
          # inspectable products, a value PNG. All three move together: the
          # page decides a frame exists from its metadata file alone, so a
          # metadata file that outlived its data would animate as a blank frame.

          data_name() {   # <product> <index>
            if [ "$1" = "rate" ]; then
              if [ "$2" -eq 0 ]; then echo "master.geojson"; else echo "master_$2.geojson"; fi
            else
              echo "$1_$2.geojson"
            fi
          }
          meta_name() {   # <product> <index>
            if [ "$1" = "rate" ]; then echo "metadata_$2.json"; else echo "metadata_$1_$2.json"; fi
          }
          val_name() {    # <product> <index>
            echo "$1_val_$2.png"
          }

          for product in rate refl mesh qpe6h qpe24h lightning rotation; do
            # Frame 14 ages out of the archive on this run. Clear it first: the
            # shift below only overwrites the parts frame 13 actually has, so
            # anything frame 14 owns that frame 13 doesn't would linger for good.
            rm -f "$(data_name "$product" 14)" "$(meta_name "$product" 14)" \
                  "$(val_name "$product" 14)"

            for i in $(seq 13 -1 0); do
              next=$((i+1))
              src=$(data_name "$product" "$i")
              if [ -f "$src" ]; then
                mv -f "$src" "$(data_name "$product" "$next")"
                if [ -f "$(meta_name "$product" "$i")" ]; then
                  mv -f "$(meta_name "$product" "$i")" "$(meta_name "$product" "$next")"
                fi
                if [ -f "$(val_name "$product" "$i")" ]; then
                  mv -f "$(val_name "$product" "$i")" "$(val_name "$product" "$next")"
                fi
              else
                # No frame data at this index: drop anything left behind for it
                # so the page doesn't advertise a frame it cannot draw.
                rm -f "$(meta_name "$product" "$i")" "$(val_name "$product" "$i")"
              fi
            done
          done

      - name: Run Processing Script
        run: python scripts/process_mrms.py

      - name: Commit and Push
        run: |
          git config --global user.name "weather-bot"
          git config --global user.email "bot@weather.com"
          # -A so the rotation's renames and removals are staged too — a glob
          # only picks up files that still exist, which would leave the dropped
          # oldest frame committed forever.
          git add -A public/data
          git commit -m "Update radar: $(date)" || echo "No changes"
          git push origin main
